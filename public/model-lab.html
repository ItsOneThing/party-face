<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>partyface · FaceNet512 本地测试</title><link rel="stylesheet" href="styles.css"><style>main{max-width:800px;padding-top:35px}label{display:block;margin:16px 0}input[type=file]{display:block;margin-top:8px;max-width:100%}button{margin-top:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:var(--green)}</style><script defer src="model-lab-boot.js"></script></head><body><main><a href="admin.html">← 管理工具</a><h1>FaceNet512 本地测试</h1><p>只在你的浏览器里处理照片。本页不调用 Supabase 或 Drive，不保存或上传照片、人脸特征。刷新或关闭页面后清除本页的选择和测试状态。</p><button id="lab-smoke" class="secondary">先验证模型运行（合成输入，不用真实照片）</button><section class="admin-card"><label><input id="lab-consent" type="checkbox"> 我确认测试照片中的人物已明确同意用于本次人脸识别测试。</label><label>参考自拍（只包含一张清晰人脸）<input id="lab-selfie" type="file" accept="image/jpeg,image/png,image/webp"></label><label>待对比照片（可多选）<input id="lab-photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><button id="lab-run" class="primary" disabled>加载并测试 FaceNet512</button><p id="lab-status" role="status" aria-live="polite">首次加载约 94 MB 模型和浏览器运行时。无需云端 API 密钥。</p><pre id="lab-results" aria-live="polite"></pre></section><p>距离越小越相似，不能换算成准确率。0.75 是未校准的起始距离阈值；请结合你知道的正确、错误照片评估。多人合照会取其中最接近的一张脸，可能误匹配。</p></main></body></html>
