<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>partyface · 在线导入照片</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin-ui.css"><link rel="stylesheet" href="theme.css"><script type="module" src="online-import.js?v=large-preview-20260929"></script></head><body><main class="admin-main" style="padding:24px;max-width:none;margin:0"><section class="admin-card"><p class="eyebrow">PREPARE YOUR EVENT</p><h2>导入活动照片</h2><p>粘贴 Drive 文件夹，在这里完成扫描和导入。原图留在 Drive，缩略图保存到 Supabase。</p><p id="admin-status" role="status" aria-live="polite">正在连接在线导入服务…</p><label for="title">活动名称</label><input id="title" maxlength="100"><label for="title-it">意大利语活动名称（选填）</label><input id="title-it" maxlength="100"><label for="photo-credit">照片来源（显示在活动页）</label><input id="photo-credit" maxlength="120" placeholder="例如：摄影社名称"><label for="photo-credit-it">意大利语照片来源（选填）</label><input id="photo-credit-it" maxlength="120"><label for="contact-name">活动联系人（选填）</label><input id="contact-name" maxlength="80" placeholder="例如：OneThing"><label for="slug">活动编号</label><input id="slug" pattern="[a-z0-9-]+"><div class="admin-actions"><button id="load-event" class="secondary" type="button">载入这个活动的资料</button><button id="new-event" class="secondary" type="button">新建活动</button></div><label for="folder">Google Drive 文件夹链接</label><input id="folder" placeholder="粘贴已公开分享的活动文件夹链接"><label class="consent"><input id="face-enabled" type="checkbox"><span>同时建立人脸索引：我确认被处理人物已明确同意本次人脸识别与分组。</span></label><button id="scan" class="primary" disabled>扫描照片 ↗</button><p class="admin-note">不勾选时只导入照片浏览。支持子文件夹及 JPG、PNG、WebP，超过 25 MB 的原图自动使用 Drive 预览图处理，原图保留。识别在浏览器中进行，导入期间请保持页面打开，电脑不要休眠。</p></section><section id="import-panel" class="admin-card" hidden><h2 id="summary"></h2><progress id="progress" class="progress" max="1" value="0"></progress><div class="admin-actions"><button id="import" class="primary">开始导入</button><button id="stop" class="secondary" disabled>处理完当前照片后暂停</button></div><img id="import-preview" class="admin-preview" alt="正在处理的活动照片" hidden><pre id="log" class="admin-log" aria-live="polite"></pre><div class="admin-actions"><button id="publish" class="primary" disabled>开放活动并生成链接</button><button id="close" class="secondary" disabled>关闭活动查询</button></div><p class="admin-note">失败后重新扫描，可跳过已完成照片。每次生成链接会更新访问码，旧链接随之失效；修改照片时无需重新生成链接。</p><div id="share" class="admin-result" hidden><p>分享给参加者的完整链接：</p><a id="share-link" target="_blank" rel="noopener noreferrer"></a><div class="admin-actions"><button id="copy" class="secondary">复制链接</button></div></div></section></main></body></html>
